spring.application.name=loan-requests

# Persistencia: H2 en memoria via R2DBC (sin dependencias externas para ejecutar).
# LOCK_TIMEOUT: tiempo maximo que una transaccion espera el bloqueo de fila del cupo diario.
spring.r2dbc.url=r2dbc:h2:mem:///loans;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.r2dbc.username=sa
spring.r2dbc.password=
spring.r2dbc.pool.max-size=20
spring.sql.init.mode=always

# Reglas de negocio (RF03)
loans.min-credit-score=650
loans.max-income-multiplier=8
loans.daily-approved-limit=15000000
# Zona horaria que define el "dia calendario" del limite diario
loans.business-zone=America/Bogota

management.endpoints.web.exposure.include=health,info
logging.level.com.ias.loans=INFO
